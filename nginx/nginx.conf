events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hardening: hide Nginx version string
    server_tokens off;

    # Performance & Request Limits
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Multi-Tier Rate Limiting & Connection Throttling (HTTP 429 on exceed)
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Scheme-Aware Security Header Maps
    map $scheme $hsts_header {
        https   "max-age=63072000; includeSubDomains; preload";
        default "";
    }

    map $scheme $csp_header {
        https   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;";
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
    }

    # Upstreams
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    # Hardened HTTP Server (Local Dev, CI, & Pre-Certificate ACME Bootstrap)
    server {
        listen 80;
        server_name _;

        include /etc/nginx/snippets/security-headers.conf;

        # Let's Encrypt ACME HTTP-01 Verification Webroot
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        include /etc/nginx/snippets/proxy-locations.conf;
    }
}
