# Shared Production Security Headers
# Note: $hsts_header and $csp_header are computed via `map $scheme` in http {}.
# Nginx automatically omits headers whose variable evaluates to "".

add_header Strict-Transport-Security $hsts_header always;
add_header Content-Security-Policy $csp_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
